<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yakumi Tower</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Start Screen */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #startOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .title {
      font-size: 4rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff9a9e, #fad0c4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    #startBtnChibi,
    #startBtnMini,
    #helpBtn,
    #backBtn {
      padding: 0.8rem 2.5rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      min-width: 200px;
    }

    #startBtnChibi {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    #startBtnMini {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #333;
      box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
    }

    #helpBtn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #startBtnChibi:hover,
    #startBtnMini:hover,
    #helpBtn:hover,
    #backBtn:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.1);
    }

    /* Help Screen */
    #helpOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 150;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    #helpOverlay.show {
      display: flex;
    }

    .help-content {
      max-width: 500px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .help-content h2 {
      color: #fad0c4;
      margin-bottom: 1.5rem;
    }

    .help-content p {
      margin-bottom: 1rem;
      color: #ccc;
    }

    .contact-info {
      font-size: 0.9rem;
      color: #888;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #backBtn {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Score Display */
    #scoreDisplay {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      z-index: 50;
    }

    /* Game Over Screen */
    #gameOverScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    #gameOverScreen.show {
      display: flex;
    }

    .gameOverTitle {
      font-size: 3rem;
      color: #ff6b6b;
      margin-bottom: 1rem;
    }

    .finalScore {
      font-size: 2rem;
      color: white;
      margin-bottom: 2rem;
    }

    #rankingList {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 2rem;
      min-width: 300px;
    }

    .rankingItem {
      color: white;
      padding: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
    }

    .rankingItem.highlight {
      background: rgba(102, 126, 234, 0.3);
      border-radius: 5px;
    }

    #nameInput {
      padding: 10px 20px;
      font-size: 1.2rem;
      border: 2px solid #667eea;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-align: center;
      margin-bottom: 1rem;
    }

    #restartBtn {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #restartBtn:hover {
      transform: scale(1.05);
    }
  </style>
  <script type="module" crossorigin src="/yakumi-tower2/assets/index-ClxwoGjn.js"></script>
</head>

<body>
  <!-- Start Screen -->
  <div id="startOverlay">
    <h1 class="title">薬味タワー</h1>
    <p class="subtitle">Yakumi Tower</p>
    <div class="button-group">
      <button id="startBtnChibi">ちび</button>
      <button id="startBtnMini">みに</button>
      <button id="helpBtn">あそびかた</button>
    </div>
  </div>

  <!-- Help Screen -->
  <div id="helpOverlay">
    <div class="help-content">
      <h2>あそびかた</h2>
      <p>操作はかんたん！<br>マウスや指で薬味を移動させ、タップやクリックで土台の上に落とすだけ。</p>
      <p>薬味を落とさずに、どこまで高く積み上げられるか挑戦しましょう！</p>
      <p><b>ちび：</b> 通常モードです。<br><b>みに：</b> アイテムが大きく、滑りにくくなっています。</p>
      <div class="contact-info">
        <p>Discordでクレームをあげておくと、そのうち改善されるかもしれません。</p>
        <p>やばそうな問題があった時の連絡先：<br>X → INTERNET_NEON</p>
      </div>
    </div>
    <button id="backBtn">もどる</button>
  </div>

  <!-- Score Display -->
  <div id="scoreDisplay">Score: <span id="scoreValue">0</span></div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen">
    <h2 class="gameOverTitle">Game Over!</h2>
    <p class="finalScore">Final Score: <span id="finalScoreValue">0</span></p>
    <div id="rankingList"></div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="10" style="display:none;">
    <button id="submitNameBtn"
      style="display:none; padding: 0.5rem 1.5rem; margin-bottom: 1rem; font-size: 1rem; border: none; border-radius: 20px; background: #4CAF50; color: white; cursor: pointer; font-weight: bold;">Submit</button>
    <button id="restartBtn">Play Again</button>
  </div>

  <div id="app"></div>
</body>

</html>
